backend:
  name: github
  repo: "YOUR_GITHUB_OWNER/dataclap-blog" # TODO: update once the new repo exists
  branch: main
  base_url: "https://decap.dataclap.co" # TODO: point at your deployed decap-proxy Worker (see decap-proxy/)
  auth_endpoint: "auth"
site_url: "https://blog.dataclap.co" # the URL of your site

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    folder: "src/pages" # the folder where your CMS managed Astro pages are located
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
